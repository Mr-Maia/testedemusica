<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Song 163">
<meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<title>Song 163</title>
<style>
  :root{
    --bg:#fffdf8; --paper:#fffdf8; --fg:#23211d; --muted:#8a857b; --rule:#efe9dd;
    --h:#d6e9fb; --h-ink:#1d5a93; --m:#fbdbe8; --m-ink:#a3285d; --t:#dcf0d0; --t-ink:#3d7a1f;
    --gh:#fdecae; --gh-ink:#8a6200; --gm:#e7dcfb; --gm-ink:#5b3aa6; --gt:#ffd8c2; --gt-ink:#b0461a;
    --size:22px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1a18; --paper:#1b1a18; --fg:#f3efe7; --muted:#9a948a; --rule:#2e2c28;
      --h:#1b3a57; --h-ink:#9fcbf5; --m:#4a1f33; --m-ink:#f5a9c9; --t:#243f18; --t-ink:#b1e095;
      --gh:#4a3a0c; --gh-ink:#f5d46b; --gm:#34264f; --gm-ink:#c9b3f7; --gt:#4d2615; --gt-ink:#ffb48a;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--rule)}
  .bar{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .legend{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .chip{font-size:15px;font-weight:700;padding:5px 11px;border-radius:999px}
  .chip.homens{background:var(--h);color:var(--h-ink)}
  .chip.mulheres{background:var(--m);color:var(--m-ink)}
  .chip.todos{background:var(--t);color:var(--t-ink)}
  .chip.gh{background:var(--gh);color:var(--gh-ink)}
  .chip.gm{background:var(--gm);color:var(--gm-ink)}
  .chip.gt{background:var(--gt);color:var(--gt-ink)}
  .legend .lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);align-self:center;width:5.6em}
  .legend .row{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .chip.normal{border:1px solid var(--rule);color:var(--muted);font-weight:600}
  .zoom{display:flex;gap:6px}
  .zoom button{font:700 17px/1 inherit;width:44px;height:40px;border-radius:12px;border:1px solid var(--rule);
    background:var(--paper);color:var(--fg);cursor:pointer}
  main{max-width:620px;margin:0 auto;padding:22px 16px calc(env(safe-area-inset-bottom) + 80px);font-size:var(--size)}
  .date{color:var(--muted);font-size:14px;text-align:center;margin:0 0 14px}
  h1{font-size:1.5em;line-height:1.15;margin:0 0 .15em;letter-spacing:-.01em}
  .ref{color:var(--muted);font-size:.8em;margin:0 0 1.2em}
  section{margin:0 0 1.4em}
  h2{font-size:.62em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 .5em}
  .v{margin:0;padding:.18em .45em;line-height:1.5;border-radius:.3em}
  .v + .v{margin-top:.12em}
  .v.ind{margin-left:1.2em}
  .v.normal{color:var(--muted)}
  .v.homens{background:var(--h)}
  .v.mulheres{background:var(--m)}
  .v.todos{background:var(--t)}
  .v.gh,.s.gh{background:var(--gh)} .v.gm,.s.gm{background:var(--gm)} .v.gt,.s.gt{background:var(--gt)}
  .v.mix{padding-left:0;padding-right:0}
  .s{padding:.12em .3em;border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .who{display:inline-block;font-size:.55em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    margin:.9em 0 .25em .6em}
  .who.homens{color:var(--h-ink)} .who.mulheres{color:var(--m-ink)} .who.todos{color:var(--t-ink)}
  .who.normal{color:var(--muted)}
  .who .gh{color:var(--gh-ink)} .who .gm{color:var(--gm-ink)} .who .gt{color:var(--gt-ink)} .who .sep{color:var(--muted)}
  .foot{color:var(--muted);font-size:.7em;margin-top:2em}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="legend">
      <div class="row"><span class="lbl">Everyone</span><span class="chip homens">Brothers</span><span class="chip mulheres">Sisters</span><span class="chip todos">All</span></div>
      <div class="row"><span class="lbl">Group</span><span class="chip gh">Brothers</span><span class="chip gm">Sisters</span><span class="chip gt">All</span></div>
    </div>
    <div class="zoom">
      <button id="menos" aria-label="Smaller text">A−</button>
      <button id="mais" aria-label="Larger text">A+</button>
    </div>
  </div>
</header>
<main>
  <h1>Happy Are These Eyes</h1>
  <p class="ref">Song 163 · (Matthew 13:16)</p>
  <div id="song"></div>
  <p class="foot">(See also Matt. 7:24.)</p>
</main>
<script>
window.LETRA = "../letra-grupo.txt";
const nomes = {homens:"Brothers", mulheres:"Sisters", todos:"All", normal:"Not sung", gh:"Brothers", gm:"Sisters", gt:"All"};
const LETRA = window.LETRA || "letra.txt";
const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function parse(txt){
  const secs=[]; let sec=null, g="normal", coro=null;
  for (const raw of txt.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    if (line.startsWith("## ")){ sec={titulo:line.slice(3), linhas:[]}; secs.push(sec); g="normal";
      if(/^(coro|chorus)$/i.test(sec.titulo) && !coro) coro=sec; continue; }
    if (line.startsWith("#")) continue;
    if (line.startsWith("@")){ g=line.slice(1).trim().toLowerCase(); continue; }
    if (line==="CORO"){ if(coro) secs.push(coro); sec=null; continue; }
    if (!sec){ sec={titulo:"", linhas:[]}; secs.push(sec); }
    const ind=line.startsWith(">");
    const txt = ind ? line.slice(1).trim() : line;
    const segs=[]; let cur=g;                  // "[gm]texto" muda de grupo a meio do verso
    txt.split(/\[(\w+)\]/).forEach((part,i) => { if(i%2) cur=part.toLowerCase(); else if(part) segs.push({g:cur,t:part.trim()}); });
    sec.linhas.push({segs, ind});
  }
  return secs;
}
function render(secs){
  document.getElementById("song").innerHTML = secs.map(s => {
    let prev=null, html="";
    for (const l of s.linhas){
      const gs=[...new Set(l.segs.map(x=>x.g))], key=gs.join();
      if (key!==prev){
        const grupo = gs.every(x=>/^g[hmt]$/.test(x));
        html += gs.length===1 && !grupo
          ? `<div class="who ${gs[0]}">${nomes[gs[0]]||gs[0]}</div>`
          : `<div class="who">${grupo?'<span class="sep">Group · </span>':""}${gs.map(x=>`<span class="${x}">${nomes[x]||x}</span>`).join('<span class="sep"> → </span>')}</div>`;
      }
      html += l.segs.length===1
        ? `<p class="v ${l.segs[0].g}${l.ind?" ind":""}">${esc(l.segs[0].t)}</p>`
        : `<p class="v mix${l.ind?" ind":""}">${l.segs.map(x=>`<span class="s ${x.g}">${esc(x.t)}</span>`).join(" ")}</p>`;
      prev=key;
    }
    return `<section><h2>${esc(s.titulo)}</h2>${html}</section>`;
  }).join("");
}
fetch(LETRA,{cache:"no-cache"}).then(r=>r.text()).then(t=>render(parse(t)))
  .catch(()=>{document.getElementById("song").textContent="Could not load the lyrics.";});

let size=22; try{ size=+localStorage.getItem("size")||22 }catch(e){}
const setSize=n=>{ size=Math.max(16,Math.min(36,n)); document.documentElement.style.setProperty("--size",size+"px");
  try{localStorage.setItem("size",size)}catch(e){} };
setSize(size);
document.getElementById("mais").onclick=()=>setSize(size+2);
document.getElementById("menos").onclick=()=>setSize(size-2);
</script>
</body>
</html>
