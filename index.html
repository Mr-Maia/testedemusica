<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cântico 163 — Quem canta o quê</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d1d1f; --muted:#6b6b70; --line:#e6e3dc;
    --h-bg:#dcecfb; --h-fg:#0b4a80; --h-bar:#3b8ad9;
    --m-bg:#fbe1ec; --m-fg:#8a1d4a; --m-bar:#d9508a;
    --t-bg:#e1f3d8; --t-fg:#2f5f17; --t-bar:#5aa632;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141416; --fg:#f2f2f4; --muted:#a0a0a8; --line:#2c2c30;
      --h-bg:#16324d; --h-fg:#b9dbff; --h-bar:#5aa2ec;
      --m-bg:#46182c; --m-fg:#ffc4dc; --m-bar:#e86fa2;
      --t-bg:#1f3a14; --t-fg:#c8efb2; --t-bar:#74c24a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.6rem;line-height:1.2;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .sub a{color:inherit}
  .legend{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:2;
    background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
  .chip{font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:999px}
  .homens{background:var(--h-bg);color:var(--h-fg);--bar:var(--h-bar)}
  .mulheres{background:var(--m-bg);color:var(--m-fg);--bar:var(--m-bar)}
  .todos{background:var(--t-bg);color:var(--t-fg);--bar:var(--t-bar)}
  .normal{border:1px solid var(--line);color:var(--muted)}
  section{margin-top:24px}
  h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .bloco{margin:10px 0;padding:12px 16px 14px;border-radius:14px;border-left:6px solid var(--bar)}
  .bloco.normal{border:1px solid var(--line);border-left:6px solid var(--line);color:var(--fg)}
  .bloco p{margin:2px 0;font-size:1.25rem;line-height:1.4}
  .bloco p.ind{padding-left:1.1em}
  .who{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;opacity:.8}
  .note{margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Cântico 163<br>Happy Are These Eyes</h1>
  <p class="sub">(Mateus 13:16) · Letra completa em
    <a href="https://www.jw.org/en/library/music-songs/sing-out-joyfully/163-happy-are-these-eyes/">jw.org</a></p>

  <div class="legend">
    <span class="chip homens">Homens</span>
    <span class="chip mulheres">Mulheres</span>
    <span class="chip todos">Todos</span>
      </div>

  <div id="song"></div>

  <p class="note">(Ver também Mateus 7:24.)</p>
</main>

<script>
const nomes = {homens:"Homens", mulheres:"Mulheres", todos:"Todos", normal:"Todos"};
const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function parse(txt){
  const secs=[]; let sec=null, g="normal", coro=null;
  for (let raw of txt.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    if (line.startsWith("## ")){ sec={titulo:line.slice(3), linhas:[]}; secs.push(sec); g="normal";
      if(/^coro$/i.test(sec.titulo) && !coro) coro=sec; continue; }
    if (line.startsWith("#")) continue;
    if (line.startsWith("@")){ g=line.slice(1).trim().toLowerCase(); continue; }
    if (line==="CORO"){ if(coro) secs.push(coro); sec=null; continue; }
    if (!sec){ sec={titulo:"", linhas:[]}; secs.push(sec); }
    const ind=line.startsWith(">");
    sec.linhas.push({g, t: ind ? line.slice(1).trim() : line, ind});
  }
  return secs;
}
function render(secs){
  document.getElementById("song").innerHTML = secs.map(s => {
    const blocos=[];                       // agrupa versos seguidos do mesmo grupo
    for (const l of s.linhas){
      const b=blocos[blocos.length-1];
      if (b && b.g===l.g) b.linhas.push(l); else blocos.push({g:l.g, linhas:[l]});
    }
    return `<section><h2>${esc(s.titulo)}</h2>${blocos.map(b => `
      <div class="bloco ${b.g}"><div class="who">${nomes[b.g]||b.g}</div>
        ${b.linhas.map(l => `<p class="${l.ind?"ind":""}">${esc(l.t)}</p>`).join("")}
      </div>`).join("")}</section>`;
  }).join("");
}
fetch("letra.txt",{cache:"no-cache"}).then(r=>r.text()).then(t=>render(parse(t)))
  .catch(()=>{document.getElementById("song").textContent="Não foi possível carregar a letra.";});
</script>
</body>
</html>
